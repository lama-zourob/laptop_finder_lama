<!DOCTYPE html>
<html lang="en" data-theme="performance">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Student Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="min-h-screen bg-page text-main">
  <header id="header" class="border-b border-line bg-card"></header>
  <main class="mx-auto max-w-6xl p-4">

    <section class="py-8 text-center">
      <h1 class="text-3xl font-bold md:text-5xl">Find your perfect student laptop</h1>
      <p class="mt-3 text-muted">Browse, filter, save and compare laptops.</p>
    </section>
    <section class="grid grid-cols-2 gap-4 md:grid-cols-4">
      <div class="laptop-card"><p class="text-muted">Laptops</p><p id="stat-count" class="text-2xl font-bold text-accent">-</p></div>
      <div class="laptop-card"><p class="text-muted">Lowest price</p><p id="stat-lowest" class="text-2xl font-bold text-accent">-</p></div>
      <div class="laptop-card"><p class="text-muted">Average price</p><p id="stat-average" class="text-2xl font-bold text-accent">-</p></div>
      <div class="laptop-card"><p class="text-muted">Saved favorites</p><p id="stat-favs" class="text-2xl font-bold text-accent">0</p></div>
    </section>
    <p id="error" class="mt-4 text-center"></p>
    <section class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
      <a href="laptops.html" class="btn-action text-center">Browse laptops</a>
      <a href="details.html?id=1" class="btn-action text-center">Example details</a>
      <a href="favorites.html" class="btn-action text-center">My favorites</a>
      <a href="compare.html" class="btn-action text-center">Compare</a>
    </section>
  </main>
  <footer id="footer" class="mt-8 border-t border-line p-4 text-center text-sm text-muted"></footer>
  <script type="module" src="src/js/home.js"></script>
</body>
</html>
